server {
    listen 80;
    server_name langnghe.adctopweb.com;

    # 1. Phục vụ giao diện React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy API sang Backend .NET
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Proxy Upload ảnh (Bổ sung quan trọng)
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
    }

    # 4. Proxy Hangfire Dashboard
    location /hangfire {
        proxy_pass http://api:8080/hangfire;
        proxy_set_header Host $host;
    }
}